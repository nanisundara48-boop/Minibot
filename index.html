<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse | Premium Tasks</title>
  <!-- Clean Premium Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- PERMISSION MODAL (Runs First) -->
  <div id="permission-overlay" class="modal-overlay hidden">
    <div class="glass-card animate-pop">
      <h2>🔔 Allow Notifications</h2>
      <p style="margin: 10px 0; opacity: 0.8; font-size: 0.9rem;">
        Background lo app close ayina exact time ki alarms (Water, Gym, etc.) ravadaniki permissions ivvandi.
      </p>
      <button id="grant-permission-btn" class="primary-btn" style="width: 100%;">Grant Permissions</button>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="app-container" class="app-shell">
    
    <!-- Premium Header -->
    <header class="premium-header glass">
      <div class="header-info">
        <h1 id="greeting">Good Morning, Nani 👋</h1>
        <span id="weather-widget" class="badge">Loading...</span>
      </div>
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Nani" alt="Profile" class="avatar">
    </header>

    <!-- Main ContentArea -->
    <main class="main-content">
      
      <!-- Quick Categories -->
      <h3 class="section-title">Quick Add</h3>
      <div class="horizontal-scroll">
        <button class="category-btn glass" data-preset="💧 Drink Water">+ 💧 Water</button>
        <button class="category-btn glass" data-preset="🥞 Breakfast">+ 🥞 Breakfast</button>
        <button class="category-btn glass" data-preset="🍱 Lunch">+ 🍱 Lunch</button>
        <button class="category-btn glass" data-preset="🏋️ Gym">+ 🏋️ Gym</button>
      </div>

      <h3 class="section-title" style="margin-top: 20px;">My Alarms</h3>
      <div id="alarms-list" class="alarms-list">
        <div class="loading-text">Loading your tasks... ⏳</div>
      </div>
    </main>

    <!-- Premium FAB (No overlapping now) -->
    <button id="fab-add" class="fab-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
  </div>

  <!-- NEW TASK MODAL -->
  <div id="task-modal" class="modal-overlay hidden">
    <div class="glass-card animate-pop modal-content">
      <h3>Set New Alarm</h3>
      <form id="task-form">
        <input type="text" id="task-name" class="premium-input" placeholder="e.g. 🏋️ Gym or 💧 Water" required>
        
        <div class="row">
          <input type="time" id="task-time" class="premium-input" required>
          <select id="task-priority" class="premium-input">
            <option value="high">🔴 High Priority</option>
            <option value="med" selected>🟡 Normal</option>
          </select>
        </div>

        <label class="everyday-checkbox">
          <input type="checkbox" id="task-everyday" checked> Repeat Everyday
        </label>

        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="secondary-btn">Cancel</button>
          <button type="submit" id="save-task-btn" class="primary-btn">Save Alarm</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
