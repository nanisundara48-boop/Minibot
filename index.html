<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProductivityPulse PWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- AUTHENTICATION PAGE -->
  <div id="auth-container" class="auth-wrapper">
    <div class="glass-card auth-card animate-fade-in">
      <h2>ProductivityPulse</h2>
      <p>Your intelligent daily companion</p>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email Address" required>
        <input type="password" id="auth-password" placeholder="Password" required>
        <button type="submit" id="auth-btn" class="primary-btn">Sign In / Register</button>
      </form>
    </div>
  </div>

  <!-- GLOBAL APP SHELL -->
  <div id="app-container" class="app-shell hidden">
    
    <!-- Top Header -->
    <header class="app-header glass">
      <div class="header-left">
        <h1 id="greeting">Good Morning, User</h1>
        <div id="weather-widget" class="weather-pill">Loading weather...</div>
      </div>
      <div class="header-right">
        <div class="toggle-group">
          <label class="switch-label" title="Do Not Disturb">
            <input type="checkbox" id="dnd-toggle">
            <span class="slider round">🔕</span>
          </label>
        </div>
        <select id="theme-selector" class="theme-select">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="amoled">AMOLED</option>
        </select>
        <img id="user-avatar" src="https://via.placeholder.com/40" alt="Profile" class="avatar">
      </div>
    </header>

    <!-- Desktop Sidebar & Mobile Navigation -->
    <nav class="nav-sidebar">
      <button class="nav-btn active" data-target="view-home">🏠 Home</button>
      <button class="nav-btn" data-target="view-calendar">📅 Calendar</button>
      <button class="nav-btn" data-target="view-analytics">📈 Analytics</button>
      <button class="nav-btn" data-target="view-settings">⚙️ Settings</button>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- HOME VIEW -->
      <section id="view-home" class="app-view active">
        <!-- Horizontal Scroll Section: Streaks & Quick Presets -->
        <div class="horizontal-scroll-bar">
          <div class="streak-badge glass">🔥 <span id="streak-count">0</span> Day Streak</div>
          <button class="preset-btn glass" data-add-mins="15">+15m Nap</button>
          <button class="preset-btn glass" data-add-mins="60">+1h Break</button>
          <button class="preset-btn glass" data-add-mins="30">+30m Focus</button>
        </div>

        <!-- Search Bar with Voice Input -->
        <div class="search-container glass">
          <input type="text" id="global-search" placeholder="Search tasks or say 'Set alarm for Gym at 6 PM'...">
          <button id="mic-btn" class="icon-btn" title="Voice Control">🎤</button>
        </div>

        <!-- Alarms / Tasks Vertical List -->
        <div id="alarms-list" class="alarms-list">
          <!-- Dynamically populated alarm cards -->
        </div>
      </section>

      <!-- CALENDAR VIEW -->
      <section id="view-calendar" class="app-view">
        <h2>Interactive Schedule</h2>
        <div id="calendar-grid" class="calendar-grid glass"></div>
        <button id="export-ics" class="secondary-btn">Export to Google Calendar (.ics)</button>
      </section>

      <!-- ANALYTICS VIEW -->
      <section id="view-analytics" class="app-view">
        <h2>Performance & Audit Logs</h2>
        <div class="chart-container glass">
          <canvas id="productivityChart"></canvas>
        </div>
        <div class="audit-log-container glass">
          <h3>Audit Log</h3>
          <table id="audit-table">
            <thead>
              <tr><th>Task</th><th>Scheduled</th><th>Status</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- SETTINGS VIEW -->
      <section id="view-settings" class="app-view">
        <h2>Preferences</h2>
        <div class="glass-card">
          <p>Logged in as: <span id="user-email-display"></span></p>
          <button id="logout-btn" class="danger-btn">Sign Out</button>
        </div>
      </section>

    </main>

    <!-- Floating Action Button (FAB) -->
    <button id="fab-add" class="fab-btn">+</button>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-target="view-home">🏠</button>
      <button class="nav-btn" data-target="view-calendar">📅</button>
      <button class="nav-btn" data-target="view-analytics">📈</button>
      <button class="nav-btn" data-target="view-settings">⚙️</button>
    </nav>
  </div>

  <!-- ADD / EDIT TASK MODAL -->
  <div id="task-modal" class="modal-overlay hidden">
    <div class="glass-card modal-content">
      <h3 id="modal-title">New Alarm / Task</h3>
      <form id="task-form">
        <div class="autocomplete-wrapper">
          <input type="text" id="task-name" placeholder="Task Name (e.g., Gym, Tiffin)" autocomplete="off" required>
          <div id="autocomplete-dropdown" class="autocomplete-dropdown hidden"></div>
        </div>
        
        <div class="form-row">
          <label>Time: <input type="time" id="task-time" required></label>
          <label>Priority: 
            <select id="task-priority">
              <option value="high">High (Red)</option>
              <option value="med" selected>Medium (Yellow)</option>
              <option value="low">Low</option>
            </select>
          </label>
        </div>

        <div class="weekdays-selector">
          <label><input type="checkbox" name="day" value="1"> M</label>
          <label><input type="checkbox" name="day" value="2"> T</label>
          <label><input type="checkbox" name="day" value="3"> W</label>
          <label><input type="checkbox" name="day" value="4"> T</label>
          <label><input type="checkbox" name="day" value="5"> F</label>
          <label><input type="checkbox" name="day" value="6"> S</label>
          <label><input type="checkbox" name="day" value="0"> S</label>
          <label><input type="checkbox" id="everyday-chk"> Everyday</label>
        </div>

        <div class="form-row">
          <label>Alert Mode: 
            <select id="alert-mode">
              <option value="ring">Ring</option>
              <option value="vibrate">Vibrate</option>
            </select>
          </label>
        </div>

        <!-- Conditional Vibrate Options -->
        <div id="vibrate-options" class="sub-options">
          <label><input type="radio" name="vib-mode" value="short" checked> Short</label>
          <label><input type="radio" name="vib-mode" value="medium"> Medium</label>
          <label><input type="radio" name="vib-mode" value="long"> Long</label>
          <label><input type="radio" name="vib-mode" value="ultra"> Ultra</label>
        </div>

        <!-- Conditional Ring Options -->
        <div id="ring-options" class="sub-options">
          <select id="ring-sound">
            <option value="ping1">Ping Classic</option>
            <option value="ping2">Chime Soft</option>
          </select>
          <input type="file" id="custom-mp3" accept="audio/mp3">
        </div>

        <!-- Advanced Accordion -->
        <details class="advanced-accordion">
          <summary>Advanced Settings</summary>
          <input type="number" id="snooze-limit" placeholder="Snooze limit (mins)" value="5">
          <input type="text" id="location-trigger" placeholder="Location trigger (Lat, Lon or Address)">
          <input type="number" id="repeat-interval" placeholder="Repeat interval (hours)">
        </details>

        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="secondary-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase SDK Scripts (Modular Placeholders) -->
  <script type="module" src="app.js"></script>
</body>
</html>
